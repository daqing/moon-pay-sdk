<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>moon-pay-sdk · 支付宝集成测试</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f2f4f7; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #1f2329;
  }
  .card {
    width: 400px; background: #fff; border-radius: 16px; padding: 28px 32px 24px;
    box-shadow: 0 6px 24px rgba(15, 23, 42, .08);
  }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .sub { font-size: 12px; color: #8a919f; margin-bottom: 18px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .label { font-size: 13px; color: #51565f; }
  select {
    font-size: 14px; padding: 6px 10px; border: 1px solid #d7dbe0; border-radius: 8px; background: #fff;
  }
  select:disabled { background: #f2f4f7; color: #8a919f; }
  button {
    width: 100%; padding: 10px 0; font-size: 14px; color: #fff; background: #1677ff;
    border: none; border-radius: 10px; cursor: pointer;
  }
  button:disabled { background: #aecbfa; cursor: default; }
  .hidden { display: none !important; }
  .status {
    text-align: center; font-size: 14px; padding: 10px 0; border-radius: 10px; margin: 44px 0 14px;
    background: #f2f4f7; color: #51565f;
  }
  .status.waiting { background: #fff7e6; color: #ad6800; }
  .status.paid { background: #e8f7ef; color: #059048; font-weight: 600; }
  .status.error { background: #fdecec; color: #c5303c; }
  .meta { font-size: 12px; color: #8a919f; word-break: break-all; margin-bottom: 4px; }
  .meta b { color: #51565f; font-weight: 600; }
  details { margin: 10px 0 0; }
  summary { font-size: 12px; color: #8a919f; cursor: pointer; }
  #aliLog {
    margin-top: 8px; max-height: 160px; overflow: auto; font-size: 11px; line-height: 1.5;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #51565f;
    background: #f7f8fa; border-radius: 8px; padding: 8px 10px; white-space: pre-wrap;
  }
  .switch { text-align: center; margin-top: 14px; font-size: 13px; }
  .switch a { color: #07c160; text-decoration: none; }
</style>
</head>
<body>
<div>
<div class="card">
  <h1>支付宝 · 电脑网站支付</h1>
  <div class="sub">alipay.trade.page.pay — 真实网关，真实扣款，金额请选最小档</div>

  <div class="row">
    <span class="label">支付金额</span>
    <select id="aliAmount">
      <option value="0.01" selected>¥0.01</option>
      <option value="0.10">¥0.10</option>
      <option value="1.00">¥1.00</option>
    </select>
  </div>

  <div id="aliStatus" class="status">点击按钮跳转支付宝收银台</div>

  <button id="aliPay" class="alipay">去支付宝支付</button>

  <div class="meta" style="margin-top:14px">订单号 <b id="aliOutTradeNo">—</b></div>
  <div class="meta">金额 <b id="aliAmountText">—</b></div>

  <details>
    <summary>调试日志</summary>
    <div id="aliLog"></div>
  </details>
</div>
<div class="switch"><a href="/">微信支付 · Native 扫码 →</a></div>
</div>

<script>
  const $ = id => document.getElementById(id);
  let aliPollTimer = null;

  function log(msg) {
    const el = $('aliLog');
    el.textContent += '[' + new Date().toLocaleTimeString() + '] ' + msg + '\n';
    el.scrollTop = el.scrollHeight;
  }

  function setStatus(kind, text) {
    const el = $('aliStatus');
    el.className = 'status ' + kind;
    el.textContent = text;
  }

  function stopAliPoll() {
    if (aliPollTimer !== null) { clearInterval(aliPollTimer); aliPollTimer = null; }
  }

  async function createAliOrder() {
    stopAliPoll();
    $('aliOutTradeNo').textContent = '—';
    $('aliAmountText').textContent = '—';
    setStatus('', '正在创建订单…');
    const yuan = $('aliAmount').value;
    try {
      const res = await fetch('/api/alipay/orders?amount_yuan=' + encodeURIComponent(yuan), { method: 'POST' });
      const data = await res.json();
      if (!res.ok) {
        setStatus('error', '下单失败');
        log('下单失败: HTTP ' + res.status + ' ' + JSON.stringify(data));
        return;
      }
      $('aliOutTradeNo').textContent = data.out_trade_no;
      $('aliAmountText').textContent = '¥' + (data.amount_fen / 100).toFixed(2);
      log('下单成功: ' + data.out_trade_no + '，跳转支付宝收银台');
      log('pay_url: ' + data.pay_url);
      setStatus('waiting', '正在跳转支付宝收银台…');
      window.location.href = data.pay_url;
    } catch (e) {
      setStatus('error', '网络错误，请确认服务仍在运行');
      log('fetch /api/alipay/orders 失败: ' + e);
    }
  }

  async function pollAliStatus(no) {
    try {
      const res = await fetch('/api/alipay/orders/' + encodeURIComponent(no), { cache: 'no-store' });
      const data = await res.json();
      if (!res.ok) { log('查单失败: HTTP ' + res.status + ' ' + JSON.stringify(data)); return; }
      log('查单: ' + data.trade_status + (data.notify_seen ? ' (回调已验证)' : ''));
      switch (data.trade_status) {
        case 'TRADE_SUCCESS':
        case 'TRADE_FINISHED':
          stopAliPoll();
          setStatus('paid', '✔ 支付成功' + (data.notify_seen ? '（回调已验证）' : ''));
          break;
        case 'TRADE_CLOSED':
          stopAliPoll();
          setStatus('error', '订单已关闭');
          break;
        default:
          setStatus('waiting', '等待支付…（' + data.trade_status + '）');
      }
    } catch (e) {
      log('查单请求失败: ' + e);
    }
  }

  function startAliPoll(no) {
    stopAliPoll();
    pollAliStatus(no);
    aliPollTimer = setInterval(() => pollAliStatus(no), 2000);
  }

  $('aliPay').addEventListener('click', createAliOrder);

  (async function init() {
    let enabled = true;
    try {
      const cfg = await (await fetch('/api/config', { cache: 'no-store' })).json();
      enabled = cfg.alipay;
    } catch (e) {
      log('读取 /api/config 失败: ' + e);
    }
    if (!enabled) {
      $('aliPay').disabled = true;
      $('aliAmount').disabled = true;
      setStatus('error', '未配置 ALIPAY_* 环境变量，本页停用');
      return;
    }
    // Back from the Alipay cashier: return_url is http://<host>/alipay?alipay_order=<no>.
    const resume = new URLSearchParams(location.search).get('alipay_order');
    if (resume) {
      $('aliOutTradeNo').textContent = resume;
      setStatus('waiting', '已从支付宝返回，正在查询订单状态…');
      startAliPoll(resume);
    }
  })();
</script>
</body>
</html>
